<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>힐스초등수학</title>
<meta name="apple-mobile-web-app-title" content="힐스수학">
<meta name="theme-color" content="#2f5d4a">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fbf7ee; color: #2b2a26;
    font: 16px/1.5 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-align: center; }
  img { width: 96px; height: 96px; border-radius: 22px; }
  a { display: inline-block; margin-top: 1rem; padding: .8rem 1.4rem; border-radius: 12px; background: #2f7a5b; color: #fff;
    text-decoration: none; font-weight: 700; }
</style>
</head>
<body>
<main>
  <img src="icon-180.png" alt="">
  <h1>힐스초등수학</h1>
  <a id="go" href="#">앱 열기</a>
</main>
<script>
  // 아래 주소를 Apps Script '웹 앱 URL'(…/exec)로 바꾸세요.
  const APP_URL = 'https://script.google.com/macros/s/AKfycbxTUELWAo75wqdqqj1P3dTtfbKu56Tdt1E2qU6BBf3a_1C5Ew4nFcNPAsvVHyt0U3Zh/exec';
  const ok = /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(APP_URL);
  document.getElementById('go').href = ok ? APP_URL : '#';
  // 홈 화면에 추가하는 중에는 넘어가지 않도록 '#add' 로 열면 멈춘다
  if (ok && location.hash !== '#add') location.replace(APP_URL);
</script>
</body>
</html>
