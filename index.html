<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>힐스초등수학</title>
<meta name="apple-mobile-web-app-title" content="힐스수학">
<meta name="theme-color" content="#2f5d4a">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fbf7ee; color: #2b2a26;
    font: 16px/1.5 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-align: center; }
  .ico { width: 96px; height: 96px; border-radius: 22px; }
  .warn { color: #d2493f; font-size: .9rem; max-width: 20rem; margin: 1rem auto 0; }
  a { display: inline-block; margin-top: 1rem; padding: .8rem 1.4rem; border-radius: 12px; background: #2f7a5b; color: #fff;
    text-decoration: none; font-weight: 700; }
</style>
</head>
<body>
<main>
  <svg class="ico" role="img" aria-label="힐스초등수학 아이콘" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#b98a55"/>
  <rect x="36" y="36" width="440" height="380" rx="28" fill="#2f5d4a"/>
  <g fill="none" stroke="#fffdf8" stroke-width="26" stroke-linecap="round">
    <path d="M110 140h84M152 98v84"/>
    <path d="M318 140h84"/>
    <path d="M112 262l70 70M182 262l-70 70"/>
    <path d="M318 300h84"/>
  </g>
  <circle cx="360" cy="262" r="14" fill="#fffdf8"/><circle cx="360" cy="338" r="14" fill="#fffdf8"/>
  <rect x="300" y="438" width="150" height="34" rx="17" fill="#f4c430"/>
  <text x="72" y="470" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="52" font-weight="800" fill="#2b2a26">힐스</text>
</svg>
  <h1>힐스초등수학</h1>
  <a id="go" href="#">앱 열기</a>
  <p class="warn" id="warn" hidden></p>
</main>
<script>
  // 아래 주소를 Apps Script '웹 앱 URL'(…/exec)로 바꾸세요.
  const APP_URL = 'https://script.google.com/macros/s/AKfycbxNV4BAh9xyHbRgFFBX6iIkw6vbXinVchicZt--G03Duos49Y8WCQJGp5FHEmXtnmwl/exec';
  const ok = /^https:\/\/script\.google\.com\/(a\/macros\/[\w.-]+|macros)\/s\/[\w-]+\/exec$/.test(APP_URL.trim());
  document.getElementById('go').href = ok ? APP_URL.trim() : '#';
  const warn = document.getElementById('warn');
  if (!ok) { warn.hidden = false; warn.textContent = 'index.html 의 APP_URL 에 웹 앱 주소(https://script.google.com/…/exec)가 아직 들어가지 않았어요.'; }
  else if (location.hash === '#add') { warn.hidden = false; warn.textContent = '지금 공유 → 홈 화면에 추가를 누르세요. 추가한 아이콘으로 열면 앱으로 바로 넘어갑니다.'; }
  // 홈 화면에 추가하는 중에는 넘어가지 않도록 '#add' 로 열면 멈춘다
  if (ok && location.hash !== '#add') location.replace(APP_URL.trim());
</script>
</body>
</html>
