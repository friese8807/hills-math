<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>힐스초등수학</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="힐스수학">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2f5d4a">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  /* 앱 화면(style)이 오기 전 로딩·로그인 화면 */
  .boot { min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; background: #fbf7ee; color: #2b2a26;
    font: 16px/1.5 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-align: center; }
  .boot img { width: 84px; height: 84px; border-radius: 20px; }
  .boot h1 { font-size: 1.3rem; margin: .6rem 0 1rem; }
  .boot form { width: 100%; max-width: 340px; text-align: left; }
  .boot label { display: block; margin-bottom: .8rem; font-size: .9rem; color: #7a7366; }
  .boot input, .boot select { width: 100%; box-sizing: border-box; font: inherit; font-size: 16px; padding: .65rem .7rem; margin-top: .25rem;
    border: 1px solid #ece4d3; border-radius: 10px; background: #fffdf8; color: #2b2a26; }
  .boot button { width: 100%; padding: .8rem; border: 0; border-radius: 12px; background: #2f7a5b; color: #fff; font: inherit; font-weight: 700; }
  .boot .err { color: #d2493f; min-height: 1.5em; margin: .3rem 0 .6rem; font-size: .9rem; }
  .boot .muted { color: #7a7366; font-size: .85rem; }
  .boot[hidden] { display: none; }
</style>
</head>
<body>
<div id="boot" class="boot"><div><img src="icon-180.png" alt=""><h1>힐스초등수학</h1><p class="muted">불러오는 중…</p></div></div>
<div id="shell" hidden>
<header class="top">
  <a class="brand" href="#" data-go="home"><img class="logo-svg" src="icon-180.png" width="30" height="30" alt=""><span id="brand-name">힐스초등수학</span></a>
  <button class="icon-btn" type="button" data-act="reload" aria-label="새로고침">↻</button>
</header>
<nav class="tabs" id="tabs"></nav>
<nav class="bnav" id="bnav" aria-label="메뉴"></nav>
<div class="more-sheet" id="more" hidden></div>
<main id="main"><p class="muted">불러오는 중…</p></main>
<div id="busy" class="busy" hidden><span>저장 중…</span></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</div>
<script>
'use strict';
// Apps Script 'API' 배포 주소 (…/exec). '나'로 실행 + '모든 사용자' 배포여야 한다.
const API_URL = 'https://script.google.com/macros/s/AKfycbxNV4BAh9xyHbRgFFBX6iIkw6vbXinVchicZt--G03Duos49Y8WCQJGp5FHEmXtnmwl/exec';
const KEY = 'hills.token', DEV = 'hills.device';

function store(k, v) { try { if (v === undefined) return localStorage.getItem(k) || ''; if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return ''; } }

async function api(fn, args) {
  const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ token: store(KEY), device: store(DEV), fn, args: args || [] }) });
  const j = await r.json();
  if (!j.ok) {
    if (/비밀번호가 맞지 않/.test(j.error)) { store(KEY, null); showLogin(j.error); }
    throw new Error(j.error);
  }
  return j.res;
}

// 앱 코드(app)는 google.script.run / google.script.history 를 쓴다. 같은 모양으로 흉내 낸다.
function runner(ok, fail) {
  return new Proxy({}, { get(_, name) {
    if (name === 'withSuccessHandler') return f => runner(f, fail);
    if (name === 'withFailureHandler') return f => runner(ok, f);
    return (...args) => { api(name, args).then(r => ok && ok(r), e => fail ? fail(e) : console.error(e)); };
  } });
}
let onHistory = null;
window.google = { script: {
  run: runner(),
  history: {
    push(state) { history.pushState(state, ''); },
    replace(state) { history.replaceState(state, ''); },
    setChangeHandler(f) { onHistory = f; },
  },
} };
addEventListener('popstate', e => { if (onHistory) onHistory({ state: e.state }); });

function esc(s) { return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

function showLogin(msg) {
  document.getElementById('shell').hidden = true;
  const box = document.getElementById('boot');
  box.hidden = false;
  const dev = store(DEV);
  box.innerHTML = '<form id="login"><div style="text-align:center"><img src="icon-180.png" alt=""><h1>힐스초등수학</h1></div>' +
    '<label>이 휴대폰 이름<select name="device">' + ['아빠 폰', '엄마 폰', '아빠 PC', '엄마 PC', '기타']
      .map(d => '<option' + (d === dev ? ' selected' : '') + '>' + d + '</option>').join('') + '</select></label>' +
    '<label>비밀번호<input name="token" type="password" autocomplete="current-password" required></label>' +
    '<p class="err">' + esc(msg) + '</p><button>들어가기</button>' +
    '<p class="muted">처음 한 번만 넣으면 이 휴대폰에 기억됩니다.</p></form>';
  document.getElementById('login').onsubmit = e => {
    e.preventDefault();
    const f = e.target;
    store(DEV, f.device.value);
    store(KEY, f.token.value.trim());
    start();
  };
}

async function start() {
  if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(API_URL)) {
    document.getElementById('boot').innerHTML = '<p class="err">API 주소가 아직 들어 있지 않습니다.</p>'; return;
  }
  if (!store(KEY)) { showLogin(''); return; }
  const box = document.getElementById('boot');
  box.innerHTML = '<div><img src="icon-180.png" alt=""><h1>힐스초등수학</h1><p class="muted">불러오는 중…</p></div>';
  let b;
  try { b = await api('boot'); } catch (e) {
    if (store(KEY)) box.innerHTML = '<div><p class="err">' + esc(e.message) + '</p><button onclick="start()">다시 시도</button></div>';
    return;
  }
  // 서버의 style·app 을 붙인다 (화면 수정은 Apps Script 배포만으로 반영된다)
  const tpl = document.createElement('template');
  tpl.innerHTML = b.style;
  document.head.appendChild(tpl.content);
  window.BOOT = b.data;
  box.hidden = true;
  document.getElementById('shell').hidden = false;
  const code = b.app.replace(/^\s*<script>/, '').replace(/<\/script>\s*$/, '');
  const s = document.createElement('script');
  s.textContent = code;
  document.body.appendChild(s);
}
start();
</script>
</body>
</html>
