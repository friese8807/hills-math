<style>
:root {
  /* 공부방 테마: 공책 종이 + 칠판 초록 + 연필 노랑 */
  --bg: #fbf7ee; --card: #fffdf8; --text: #2b2a26; --muted: #7a7366; --line: #ece4d3;
  --primary: #2f7a5b; --primary-text: #fff; --board: #2f5d4a; --board-2: #3b7058;
  --green: #2f8a4f; --red: #d2493f; --orange: #e08a1e; --yellow: #f4c430;
  --soft-green: #e2f3e6; --soft-red: #fde8e4; --soft-yellow: #fff3c9; --soft: #f4eedf;
  --shadow: 0 1px 0 rgba(120, 100, 60, .06), 0 4px 14px rgba(120, 100, 60, .07);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #171a17; --card: #20251f; --text: #ece8dd; --muted: #a29d90; --line: #333a31;
    --primary: #5fb48a; --board: #1f3a2f; --board-2: #284a3b;
    --soft-green: #1d3a28; --soft-red: #43221f; --soft-yellow: #3d3416; --soft: #2a3028;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; color: var(--text);
  background: var(--bg) linear-gradient(transparent 27px, rgba(150, 175, 200, .16) 28px) 0 0 / 100% 28px;
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
a { color: var(--primary); text-decoration: none; }
h1 { font-size: 1.3rem; margin: .2rem 0 .8rem; }
h2 { font-size: 1.05rem; margin: 0 0 .6rem; }
h3 { font-size: 1rem; margin: 0 0 .4rem; }
small { font-size: .85em; }
.muted { color: var(--muted); }
.pre { white-space: pre-wrap; }
code { background: var(--soft); padding: 0 .3em; border-radius: 4px; }

.top { display: flex; align-items: center; justify-content: space-between; padding: .65rem 1rem;
  background: var(--board); color: #fff; position: sticky; top: 0; z-index: 5;
  border-bottom: 5px solid #b98a55; /* 칠판 나무틀 */ }
.brand { display: inline-flex; align-items: center; gap: .5rem; font-weight: 800; color: #fff; font-size: 1.1rem; letter-spacing: -.01em; }
.brand img { width: 30px; height: 30px; }
.brand small { font-weight: 500; opacity: .75; font-size: .75rem; }
.top button.link { color: rgba(255,255,255,.8); }
.tabs { display: flex; gap: .25rem; overflow-x: auto; padding: .45rem .6rem; background: var(--card);
  border-bottom: 1px solid var(--line); scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a { white-space: nowrap; padding: .4rem .85rem; border-radius: 999px; color: var(--muted); font-weight: 600; }
.tabs a.on { background: var(--soft-yellow); color: var(--text); box-shadow: inset 0 -3px 0 var(--yellow); }
main { max-width: 900px; margin: 0 auto; padding: 1rem; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 1rem 1.1rem; margin-bottom: 1rem; box-shadow: var(--shadow); }
h1 { font-weight: 800; letter-spacing: -.02em; }
h2 { display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; }
.head { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; margin-bottom: .6rem; }
.head h1 { margin: 0; flex: 1 1 auto; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: .6rem; margin-bottom: 1rem; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: .75rem .95rem; box-shadow: var(--shadow); border-top: 4px solid var(--primary); }
.stat.warn { border-top-color: var(--red); }
.stat span { display: block; color: var(--muted); font-size: .85rem; }
.stat b { font-size: 1.3rem; font-weight: 800; }
.stat.warn b { color: var(--red); }

.row, .row-link { display: flex; align-items: center; gap: .6rem; padding: .55rem 0; border-bottom: 1px solid var(--line); color: var(--text); flex-wrap: wrap; }
.row:last-child, .row-link:last-child { border-bottom: 0; }
.row-link:hover { background: var(--soft); }
.row-link.dim { opacity: .55; }
.grow { flex: 1 1 auto; min-width: 0; }
.time { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 3.5rem; }

.badge { display: inline-block; padding: .1rem .55rem; border-radius: 999px; background: var(--soft); font-size: .82rem; white-space: nowrap; }
.badge.green { background: var(--soft-green); color: var(--green); }
.badge.red { background: var(--soft-red); color: var(--red); }
.badge.yellow { background: var(--soft-yellow); color: #8a6400; }
.kind { font-size: .8rem; padding: 0 .4rem; border-radius: 4px; background: var(--soft); }
.k-보강 { color: var(--orange); } .k-상담 { color: var(--primary); } .k-시험 { color: var(--red); }
.flash { background: var(--soft-green); color: var(--green); padding: .6rem .9rem; border-radius: 10px; margin-bottom: 1rem; }
.error { background: var(--soft-red); color: var(--red); padding: .6rem .9rem; border-radius: 10px; }
.note { background: var(--soft); padding: .6rem .9rem; border-radius: 10px; }

input, select, textarea, button { font: inherit; color: inherit; }
input, select, textarea { width: 100%; padding: .55rem .65rem; border: 1px solid var(--line); border-radius: 10px; background: var(--card); min-height: 2.6rem; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--yellow); outline-offset: 0; border-color: var(--primary); }
textarea { resize: vertical; }
.form label, .login label { display: block; margin-bottom: .7rem; font-size: .9rem; color: var(--muted); }
.form label input, .form label select, .form label textarea { margin-top: .2rem; color: var(--text); }
.form label.check, .days label, .pick label { display: inline-flex; align-items: center; gap: .3rem; color: var(--text); }
.form label.check input, .days input, .pick input, .seg input { width: auto; min-height: 0; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
.days { display: flex; flex-wrap: wrap; gap: .4rem .9rem; margin-bottom: .7rem; }
.pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: .4rem; margin-bottom: .7rem; }
.form.row { gap: .4rem; border: 0; }
.form.row input, .form.row select { width: auto; flex: 1 1 120px; }

button, .btn { display: inline-flex; align-items: center; justify-content: center; gap: .3rem; padding: .5rem .95rem; border-radius: 10px; font-weight: 600;
  border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; min-height: 2.5rem; white-space: nowrap; }
button.primary, .btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-text); }
.form > button.primary, .login button { width: 100%; }
button.danger { background: transparent; border-color: var(--red); color: var(--red); }
button.link { border: 0; background: none; color: var(--muted); padding: 0 .3rem; min-height: 0; text-decoration: underline; }
.btn.small, button.small { padding: .25rem .6rem; min-height: 2rem; font-size: .85rem; }
.actions { display: flex; flex-wrap: wrap; gap: .4rem; margin: .6rem 0 0; }
.inline { display: inline; }
.right { float: right; }
.sticky { position: sticky; bottom: .8rem; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
.filters { display: flex; gap: .4rem; margin-bottom: 1rem; align-items: center; }
.filters input, .filters select { width: auto; flex: 1 1 auto; }
details summary { cursor: pointer; color: var(--primary); padding: .4rem 0; }
.danger-zone summary { color: var(--red); }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th, td { text-align: left; padding: .45rem .4rem; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; white-space: nowrap; }
table.num td:not(:first-child), table.num th:not(:first-child) { text-align: right; }
.neg { color: var(--red); }
progress { width: 4rem; height: .5rem; vertical-align: middle; }
dl.info { display: grid; grid-template-columns: 4.5rem 1fr; gap: .35rem .6rem; margin: 0; }
dl.info dt { color: var(--muted); }
dl.info dd { margin: 0; }
.consult { border-bottom: 1px solid var(--line); padding: .4rem 0; }
.consult p { margin: .2rem 0; }

.week { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: .6rem; }
.day { margin: 0; padding: .7rem; }
.day.today { border-color: var(--yellow); box-shadow: 0 0 0 2px var(--yellow) inset; }
.day h3 { display: flex; align-items: center; gap: .3rem; }
.day .add { margin-left: auto; font-size: 1.2rem; line-height: 1; }
.slot { display: block; padding: .3rem .4rem; border-radius: 6px; background: var(--soft); margin-bottom: .3rem; color: var(--text); font-size: .9rem; }
.slot.ev { background: transparent; border: 1px dashed var(--line); }
.ok { color: var(--green); }

.att-row { border-bottom: 1px solid var(--line); padding: .6rem 0; }
.att-row .name { margin-bottom: .3rem; font-weight: 600; }
.seg { display: flex; flex-wrap: wrap; gap: .3rem; margin-bottom: .4rem; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; }
.seg span { display: inline-block; padding: .35rem .7rem; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; font-size: .9rem; }
.seg input:checked + span { background: var(--primary); border-color: var(--primary); color: #fff; }
.seg input:checked + span.a-결석 { background: var(--red); border-color: var(--red); }
.seg input:checked + span.a-지각, .seg input:checked + span.a-조퇴 { background: var(--orange); border-color: var(--orange); }
.seg input:checked + span.a-보강 { background: var(--green); border-color: var(--green); }
.seg input:focus-visible + span { outline: 2px solid var(--primary); outline-offset: 2px; }
.att.a-결석 { color: var(--red); } .att.a-지각, .att.a-조퇴 { color: var(--orange); }
.tu-row { border-bottom: 1px solid var(--line); padding: .3rem 0; }
.tu-row .row { border: 0; }
.tu-row.paid { opacity: .75; }

.login-page { display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 1rem; }
.login { border-top: 10px solid var(--board); }
.login .logo { display: block; width: 64px; height: 64px; margin: .2rem auto .4rem; }
.login { width: 100%; max-width: 360px; }
.login h1 { text-align: center; }

@media (max-width: 520px) {
  main { padding: .7rem; }
  .two { grid-template-columns: 1fr; gap: 0; }
  .lesson .two, .att-row .two { grid-template-columns: 1fr 1fr; gap: .4rem; }
}

fieldset.box { border: 1px solid var(--line); border-radius: 10px; padding: .6rem .8rem 0; margin: 0 0 .8rem; }
fieldset.box legend { color: var(--muted); font-size: .9rem; padding: 0 .3rem; }
table.book { font-size: .85rem; }
table.book th, table.book td { text-align: center; padding: .35rem .3rem; border: 1px solid var(--line); }
table.book td.nm { text-align: left; white-space: nowrap; }
table.book td.cell { min-width: 2.8rem; font-variant-numeric: tabular-nums; }
table.book td.cell.on { background: var(--soft); }
table.book td.cell.off { background: repeating-linear-gradient(45deg, transparent 0 4px, var(--line) 4px 5px); }
td.paid-mark { text-decoration: line-through; text-decoration-color: var(--red); text-decoration-thickness: 2px; }
.secret code { font-size: 1.1rem; letter-spacing: .08em; word-break: break-all; }

/* 보강 관리 */
a.stat { color: var(--text); text-decoration: none; }
.subtabs { display: flex; gap: .3rem; margin: .4rem 0 .8rem; flex-wrap: wrap; }
.subtabs a { padding: .35rem .8rem; border: 1px solid var(--line); border-radius: 999px; color: var(--text); text-decoration: none; font-size: .9rem; }
.subtabs a.on { background: var(--primary); border-color: var(--primary); color: #fff; }
.mk-group { border-left: 6px solid var(--line); }
.g-wait { border-left-color: var(--red); } .g-plan { border-left-color: var(--yellow); } .g-done { border-left-color: var(--green); }
.mk-row .quick { padding: .2rem 0 .3rem; }
.btn.ok-btn { background: var(--green); border-color: var(--green); color: #fff; }
td.mk-cell { white-space: nowrap; } td.mk-cell .badge { margin: 1px; }
.mk-row { border-bottom: 1px solid var(--line); padding: .4rem 0; }
.mk-row .row { border: 0; }
.mk-row.mk-완료, .mk-row.mk-취소 { opacity: .75; }
.small { font-size: .85rem; }
.sheet-head h2 { margin: 0 0 .2rem; }
.sheet-head p { margin: .1rem 0; color: var(--muted); font-size: .9rem; }
table.mk-sheet td.sign { min-width: 3.5rem; }
table.mk-sheet tr.mk-대기 td:nth-child(8) { color: var(--red); font-weight: 600; }
table.mk-sheet tr.mk-완료 td:nth-child(8) { color: var(--green); }

@media print {
  .no-print, details, .btn { display: none !important; }
  body, main { background: #fff !important; color: #000 !important; padding: 0 !important; max-width: none !important; }
  .card, .sheet { border: 0 !important; box-shadow: none !important; }
  table.book th, table.book td { border: 1px solid #000 !important; color: #000 !important; }
  .sheet-head p { color: #000; }
  .table-wrap { overflow: visible; }
  @page { size: A4 landscape; margin: 12mm; }
}

/* 출석체크 · 납부 현황 */
.check-row { display: flex; flex-wrap: wrap; align-items: center; gap: .3rem .8rem; padding: .5rem 0; border-bottom: 1px solid var(--line); }
.check-row .nm { min-width: 6.5rem; }
.check-row .seg { margin: 0; }
.check-card h2 a.small { margin-left: auto; font-weight: 500; }
select.mini { width: auto; min-height: 2.5rem; padding: .3rem .4rem; }
.seg.hw { align-items: center; }
.seg.hw small { margin-right: .1rem; }
.seg input:checked + span.h-완료 { background: var(--green); border-color: var(--green); color: #fff; }
.seg input:checked + span.h-일부 { background: var(--yellow); border-color: var(--yellow); color: #3a2c00; }
.seg input:checked + span.h-안함 { background: var(--red); border-color: var(--red); color: #fff; }
.seg input:checked + span.h-none { background: var(--soft); border-color: var(--line); color: var(--muted); }
.note-tag { color: #8a6400; }
.note-box { margin-top: .8rem; padding-top: .6rem; border-top: 1px dashed var(--line); }
.sheet-row { display: grid; grid-template-columns: 9rem 9rem 1fr; gap: .2rem .7rem; align-items: start; padding: .55rem 0; border-bottom: 1px solid var(--line); }
.sheet-row label { margin: 0; }
@media (max-width: 640px) { .sheet-row { grid-template-columns: 1fr; } }

/* 사용성 검토 반영 */
.filters { flex-wrap: wrap; }
.filters input, .filters select { min-width: 0; }
.head .btn { flex: 0 0 auto; }
.head h1 { min-width: 0; }
table.num td:first-child, table.num th { white-space: nowrap; }
@media (max-width: 640px) {
  .tabs { flex-wrap: wrap; justify-content: center; gap: .15rem .1rem; padding: .35rem .3rem; }
  .tabs a { padding: .3rem .55rem; font-size: .9rem; }
  .head h1 { font-size: 1.15rem; }
}
a.stat:hover { border-color: var(--primary); }
.tu-line { display: flex; flex-wrap: wrap; align-items: center; gap: .35rem; margin-top: .3rem; }
.more { display: block; text-align: center; padding: .5rem 0 0; font-weight: 600; }

/* Apps Script 판 추가 */
.brand .logo { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; background: #2f5d4a;
  border: 3px solid #b98a55; color: #fff; font-weight: 800; font-size: 1rem; }
.busy { position: fixed; inset: 0; background: rgba(0,0,0,.18); display: grid; place-items: center; z-index: 50; }
.busy[hidden], .toast[hidden] { display: none; }
.busy span { background: var(--card); padding: .7rem 1.2rem; border-radius: 12px; box-shadow: var(--shadow); font-weight: 700; }
.toast { position: fixed; left: 50%; bottom: 1.2rem; transform: translateX(-50%); background: #2b2a26; color: #fff;
  padding: .6rem 1.1rem; border-radius: 999px; z-index: 60; font-size: .92rem; max-width: 90vw; text-align: center; }
.toast.err { background: var(--red); }
.tabs a { cursor: pointer; }
.lesson-box { margin-top: .6rem; }
.lesson-box summary { font-weight: 600; }
.mk-sheet th, .mk-sheet td { border: 1px solid var(--line); text-align: center; padding: .35rem .3rem; }
.sheet-title { text-align: center; margin: .2rem 0 .6rem; }
.days-pick { display: flex; flex-wrap: wrap; gap: .3rem .8rem; margin: .2rem 0 .7rem; }
.days-pick label { display: inline-flex; gap: .25rem; align-items: center; color: var(--text); }
.days-pick input { width: auto; min-height: 0; }
.cls-row { border-bottom: 1px solid var(--line); padding: .5rem 0; }
@media print {
  .top, .tabs, .toast, .busy { display: none !important; }
}

/* 휴대폰 사용성 */
input, select, textarea { font-size: 16px; }  /* 아이폰은 16px 미만 입력칸을 누르면 화면을 확대한다 */
.icon-btn { background: none; border: 0; color: #fff; font-size: 1.4rem; min-height: 2.4rem; padding: 0 .4rem; }
.bnav, .more-sheet { display: none; }
.seg span { min-height: 2.4rem; display: inline-flex; align-items: center; }
@media (max-width: 640px) {
  .tabs { display: none; }
  .top { padding: .5rem .8rem; }
  /* 앱 모양: 위 머리·아래 메뉴는 제자리, 가운데(main)만 스크롤 → 스크롤해도 메뉴가 딸려 올라오지 않는다 */
  /* 구글이 내용을 한 겹 더 감싸므로 body 대신 #app 을 화면 크기에 고정한다 */
  html, body { height: 100%; overflow: hidden; }
  #app { position: fixed; top: 0; left: 0; right: 0; bottom: 0; height: 100%; display: flex; flex-direction: column; overflow: hidden; }
  .top { position: relative; flex: none; }
  main { flex: 1 1 0; min-height: 0; width: 100%; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain; padding: .7rem .7rem 1.2rem; will-change: transform; }
  .bnav { display: flex; position: relative; flex: none; order: 9; z-index: 40; background: var(--card);
    border-top: 1px solid var(--line); padding: .25rem .2rem calc(.25rem + env(safe-area-inset-bottom)); box-shadow: 0 -2px 10px rgba(0,0,0,.06); }
  .bnav a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: .05rem; padding: .3rem 0; border-radius: 12px;
    color: var(--muted); font-size: .72rem; font-weight: 700; text-decoration: none; }
  .bnav a span { font-size: 1.25rem; line-height: 1.2; filter: grayscale(1); opacity: .7; }
  .bnav a.on { color: var(--text); background: var(--soft-yellow); }
  .bnav a.on span { filter: none; opacity: 1; }
  .more-sheet:not([hidden]) { display: flex; flex-direction: column; position: fixed; right: .5rem; bottom: calc(70px + env(safe-area-inset-bottom));
    z-index: 45; background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.18); min-width: 11rem; }
  .more-sheet a { padding: .85rem 1rem; color: var(--text); text-decoration: none; font-weight: 600; border-bottom: 1px solid var(--line); }
  .more-sheet a:last-child { border-bottom: 0; }
  .more-sheet .ver { padding: .5rem 1rem; color: var(--muted); font-size: .72rem; border-top: 1px solid var(--line); }
  .toast { bottom: calc(80px + env(safe-area-inset-bottom)); }
  .check-card > .actions { position: sticky; bottom: 0; z-index: 5; background: var(--card);
    margin: .4rem -.2rem 0; padding: .5rem .2rem; border-top: 1px solid var(--line); }
  .check-card > .actions { flex-wrap: nowrap; gap: .4rem; }
  .check-card > .actions .btn { flex: 1 1 0; min-height: 2.9rem; white-space: normal; line-height: 1.2; padding: .4rem .5rem; }
  .seg { gap: .3rem; }
  .seg span { padding: .4rem .62rem; }
  .stats { grid-template-columns: 1fr 1fr; }
  .head h1 { font-size: 1.1rem; }
  button.sticky, .primary.sticky { bottom: .5rem; }
}
@media print { .bnav, .more-sheet { display: none !important; } }
.logo-svg { border-radius: 8px; flex: 0 0 auto; }
/* 성별·학년 */
.sx, .gr { display: inline-block; font-size: .78rem; font-weight: 800; line-height: 1; padding: .28em .5em; border-radius: 999px; vertical-align: .1em; margin-left: .25rem; white-space: nowrap; }
.sx.m { background: #dbeafe; color: #1d4ed8; } .sx.f { background: #fce7f3; color: #be185d; }
.nm-m { color: #1d4ed8; } .nm-f { color: #be185d; }
.gr { background: var(--soft); color: var(--text); border: 1px solid var(--line); }
.gr.g1, .gr.g2 { background: #dcfce7; color: #15803d; border-color: transparent; }
.gr.g3 { background: #ccfbf1; color: #0f766e; border-color: transparent; }
.gr.g4 { background: #fef3c7; color: #b45309; border-color: transparent; }
.gr.g5 { background: #ede9fe; color: #6d28d9; border-color: transparent; }
.gr.g6 { background: #ffe4e6; color: #be123c; border-color: transparent; }
.gr.none { color: var(--muted); border-style: dashed; background: none; }
